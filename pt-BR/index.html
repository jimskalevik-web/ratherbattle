<style>
    /* pt-BR */
  :root {
    --bg: #f7f2e9;
    --surface: #ffffff;
    --ink: #201c1a;
    --ink-soft: #726a63;
    --accent-a: #d94222;
    --accent-a-soft: #f6ded6;
    --accent-b: #0f7a6c;
    --accent-b-soft: #d7ece7;
    --line: #e7ddcf;
    --badge-bg: #201c1a;
    --badge-ink: #f7f2e9;
    --shadow: rgba(32, 28, 26, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16151a;
      --surface: #1f1d22;
      --ink: #f2eee6;
      --ink-soft: #a8a19a;
      --accent-a: #ff6a42;
      --accent-a-soft: #3c231b;
      --accent-b: #22b39f;
      --accent-b-soft: #17352f;
      --line: #322f36;
      --badge-bg: #f2eee6;
      --badge-ink: #16151a;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #16151a;
    --surface: #1f1d22;
    --ink: #f2eee6;
    --ink-soft: #a8a19a;
    --accent-a: #ff6a42;
    --accent-a-soft: #3c231b;
    --accent-b: #22b39f;
    --accent-b-soft: #17352f;
    --line: #322f36;
    --badge-bg: #f2eee6;
    --badge-ink: #16151a;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Sora", ui-sans-serif, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-block: 14px 10px;
  }
  .wordmark {
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .wordmark span { color: var(--accent-a); }

  .topbar-right { display: flex; align-items: center; gap: 8px; }

  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 0.82rem;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px 6px 10px;
    white-space: nowrap;
    font-family: "Sora", sans-serif;
    cursor: pointer;
  }
  .chip strong { color: var(--ink); font-size: 0.92rem; }
  .chip svg { flex: none; color: var(--accent-a); }
  .chip:focus-visible { outline: 2px solid var(--accent-a); outline-offset: 2px; }
  /* Today's dilemma is still waiting: the chip is the way in. */
  .chip.todo {
    border-color: var(--accent-a);
    color: var(--accent-a);
    background: var(--accent-a-soft);
  }
  .chip.todo svg { color: var(--accent-a); }

  .icon-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    padding: 0;
    flex: none;
  }
  .icon-btn:focus-visible { outline: 2px solid var(--accent-a); outline-offset: 2px; }
  .icon-btn.nudge { border-color: var(--accent-a); animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge {
    0%, 100% { box-shadow: 0 0 0 0 rgba(217, 66, 34, 0.45); }
    50% { box-shadow: 0 0 0 7px rgba(217, 66, 34, 0); }
  }

  /* Båndet øverst: «åpne i Chrome» eller «legg appen på hjemskjermen». */
  .tipsbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--accent-b);
    color: #f4fffb;
    border-radius: 14px;
    padding: 9px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 10px;
  }
  .tipsbar[hidden] { display: none; }
  .tipsbar .tips-text { flex: 1; min-width: 0; }
  .tipsbar .tips-btn {
    flex: none;
    background: #fff;
    color: var(--accent-b);
    border: none;
    border-radius: 10px;
    padding: 7px 12px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  .tipsbar .tips-btn[hidden] { display: none; }
  .tipsbar .tips-close {
    flex: none;
    background: none;
    border: none;
    color: inherit;
    opacity: 0.75;
    font-size: 1.1rem;
    line-height: 1;
    padding: 0 2px;
    cursor: pointer;
  }
  @media (max-width: 379px) {
    .tipsbar { font-size: 0.74rem; gap: 7px; padding: 8px 10px; }
    .tipsbar .tips-btn { padding: 6px 9px; }
  }
  /* I mørk drakt er grønnfargen lys, så teksten må være mørk for å leses. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .tipsbar { color: #06231f; }
    :root:not([data-theme="light"]) .tipsbar .tips-btn { background: #06231f; color: #e9fffa; }
  }
  :root[data-theme="dark"] .tipsbar { color: #06231f; }
  :root[data-theme="dark"] .tipsbar .tips-btn { background: #06231f; color: #e9fffa; }

  .duel-banner {
    flex: none;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--badge-bg);
    color: var(--badge-ink);
    border-radius: 14px;
    padding: 9px 14px;
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 10px;
  }
  body.duel .duel-banner, body.daily .duel-banner { display: flex; }
  body.daily .duel-banner { background: var(--accent-a); color: #fff9f4; }
  .duel-banner .quit {
    background: none;
    border: none;
    color: inherit;
    opacity: 0.72;
    font-size: 0.78rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }

  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: max(14px, env(safe-area-inset-bottom, 0px));
  }

  .option {
    position: relative;
    flex: 1;
    min-height: 0;
    border-radius: 22px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18px 22px;
    gap: 14px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  }
  .option:focus-visible { outline: 3px solid var(--ink); outline-offset: -6px; }

  .option-a { background: var(--accent-a); }
  .option-b { background: var(--accent-b); }

  .option-label {
    position: relative;
    z-index: 2;
    color: #fff9f4;
    font-weight: 700;
    font-size: clamp(1.15rem, 5vw, 1.7rem);
    line-height: 1.2;
    text-wrap: balance;
    max-width: 30ch;
    transition: transform 0.35s ease;
  }

  .option-fill {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.16);
    transform-origin: bottom;
    transform: scaleY(0);
    transition: transform 0.7s cubic-bezier(.22,.9,.3,1);
    z-index: 1;
  }
  .option.revealed .option-fill { transform: scaleY(1); }

  .option-pct {
    position: relative;
    z-index: 2;
    font-family: "Sora", sans-serif;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: clamp(1.6rem, 8vw, 2.4rem);
    color: #fff9f4;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.4s ease 0.15s, transform 0.4s ease 0.15s;
  }
  .option.revealed .option-pct { opacity: 1; transform: translateY(0); }
  .option.revealed .option-label { transform: translateY(-6px); font-size: clamp(0.95rem, 3.4vw, 1.15rem); opacity: 0.92; }

  .tag {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    padding: 4px 10px;
    border-radius: 999px;
    opacity: 0;
    white-space: nowrap;
  }
  .option.chosen .tag-you {
    top: 14px;
    color: var(--ink);
    background: #fff9f4;
    animation: tag-in 0.3s ease 0.2s forwards;
  }
  .option.friend-pick .tag-friend {
    bottom: 14px;
    color: #fff9f4;
    background: rgba(0, 0, 0, 0.42);
    animation: tag-in 0.3s ease 0.35s forwards;
  }
  .tag-you { top: 14px; }
  .tag-friend { bottom: 14px; }
  /* «ELLER»-sirkelen stikker inn i begge kortene der de møtes. Merkelappene
     som ville havnet under den, flyttes forbi. */
  .option-b.chosen .tag-you { top: 40px; }
  .option-a.friend-pick .tag-friend { bottom: 40px; }
  @keyframes tag-in { to { opacity: 1; } }

  .divider {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 4;
    background: var(--badge-bg);
    color: var(--badge-ink);
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px var(--shadow);
    pointer-events: none;
  }

  .nextbar {
    flex: none;
    display: flex;
    justify-content: center;
    padding-block: 12px max(14px, env(safe-area-inset-bottom, 0px));
    min-height: 56px;
  }
  .next-btn {
    font-family: "Sora", sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--badge-ink);
    background: var(--badge-bg);
    border: none;
    border-radius: 999px;
    padding: 12px 26px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .next-btn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .next-btn:focus-visible { outline: 2px solid var(--accent-a); outline-offset: 2px; }

  .hint {
    flex: none;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.78rem;
    padding-bottom: 4px;
    min-height: 1.2em;
  }

  /* ---- panels ---- */
  .panel {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(.22,.9,.3,1);
  }
  .panel.open { transform: translateY(0); }

  .panel-head {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-block: 14px 6px;
  }
  .panel-title {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
  }
  .panel-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-bottom: 28px;
  }

  .empty-state {
    margin-top: 16vh;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.95rem;
    max-width: 32ch;
    margin-inline: auto;
    line-height: 1.5;
  }

  .archetype {
    text-align: center;
    padding-block: 10px 2px;
  }
  .archetype-eyebrow {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    font-weight: 700;
  }
  .archetype-name {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 11vw, 2.9rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-top: 6px;
    text-wrap: balance;
  }
  .archetype-desc {
    color: var(--ink-soft);
    font-size: 0.9rem;
    line-height: 1.5;
    max-width: 34ch;
    margin: 10px auto 0;
    text-wrap: balance;
  }

  .score-line {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
  }
  .score-num {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 2.1rem;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .score-unit { color: var(--ink-soft); font-size: 0.85rem; }

  .verdict-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 12px auto 0;
    padding: 7px 16px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.8rem;
  }
  .verdict-pill.normal { background: var(--accent-b-soft); color: var(--accent-b); }
  .verdict-pill.outside { background: var(--accent-a-soft); color: var(--accent-a); }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
    margin-top: 16px;
  }
  .card h3 {
    margin: 0 0 8px;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-soft);
    font-weight: 700;
  }
  .card p { margin: 0; font-size: 0.86rem; line-height: 1.5; color: var(--ink-soft); }

  .chart-caption {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-top: 8px;
    line-height: 1.45;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
  }
  .stat-tile .num {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    font-variant-numeric: tabular-nums;
  }
  .stat-tile .lbl { color: var(--ink-soft); font-size: 0.74rem; margin-top: 2px; }

  .contrarian-q { font-size: 0.95rem; font-weight: 600; margin-top: 4px; line-height: 1.35; }
  .contrarian-pct {
    display: inline-block;
    margin-top: 8px;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--accent-a);
    background: var(--accent-a-soft);
    padding: 3px 10px;
    border-radius: 999px;
  }

  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btn {
    font-family: "Sora", sans-serif;
    font-weight: 600;
    font-size: 0.86rem;
    border-radius: 999px;
    padding: 11px 20px;
    cursor: pointer;
    border: 1px solid transparent;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex: 1 1 auto;
    justify-content: center;
  }
  .btn-primary { background: var(--badge-bg); color: var(--badge-ink); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn:focus-visible { outline: 2px solid var(--accent-a); outline-offset: 2px; }

  /* Duellknappen er appens viktigste vei videre, så den er den ene farge-
     flaten i toppen. Merket teller svar som har kommet mens du var borte. */
  .chip-duel {
    background: var(--accent-b-soft);
    border-color: transparent;
    color: var(--accent-b);
    font-weight: 700;
    position: relative;
  }
  .chip-duel svg { color: var(--accent-b); }
  .chip-duel strong { color: var(--accent-b); }

  .badge {
    position: absolute;
    top: -5px;
    right: -4px;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--accent-a);
    color: #fff9f4;
    font-size: 0.64rem;
    font-weight: 700;
    line-height: 17px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .icon-btn { position: relative; }
  .icon-btn.todo { border-color: var(--accent-a); color: var(--accent-a); }
  .icon-btn.todo .badge { background: var(--accent-a); }

  /* Smale telefoner: ordet «Duell» vikes, men fargeflaten blir stående — den
     er det som gjør knappen synlig. Ingen funksjon forsvinner. */
  @media (max-width: 379px) {
    .wordmark { font-size: 0.96rem; }
    .topbar-right { gap: 6px; }
    .chip-duel { padding: 7px 10px; }
    .chip-duel #duelLabel { display: none; }
    .icon-btn { width: 32px; height: 32px; }
  }

  .btn.big {
    display: flex;
    width: 100%;
    flex: none;
    padding: 15px 20px;
    font-size: 0.95rem;
  }
  .btn-sub {
    font-size: 0.8rem;
    color: var(--ink-soft);
    line-height: 1.45;
    margin: 9px 0 0;

  // Returnerer både dilemmaene og temaet for hver plass. Temaet settes i samme

  // resten — den fellen kostet meg nesten tusenvis av feilmerkede dilemmaer.
  function buildQuestions(loc) {
    var out = loc.curated.slice();
    var temaer = new Array(loc.curated.length);
    // For hvert genererte dilemma: hvilken mal det kom fra, og de to leddene.
    // Bunken bruker det til å spre malene, så «Aldri spise … igjen» ikke
    // kommer hvert femte spørsmål.
    var maler = [], ledd = [];
    for (var q = 0; q < loc.curated.length; q++) { maler.push(-1); ledd.push(null); }
    for (var i = 0; i < TEMA_OMRADER.length; i++) {
      var navn = TEMA_OMRADER[i][0], omr = TEMA_OMRADER[i][1];
      for (var j = 0; j < omr.length; j++) {
        for (var k = omr[j][0]; k <= omr[j][1] && k < temaer.length; k++) temaer[k] = navn;
      }
    }
    for (var z = 0; z < temaer.length; z++) if (!temaer[z]) temaer[z] = "everyday";

    var seen = {};
    function key(p) { return p[0] < p[1] ? p[0] + "||" + p[1] : p[1] + "||" + p[0]; }
    for (var c = 0; c < loc.curated.length; c++) seen[key(loc.curated[c])] = true;
    for (var m = 0; m < loc.templates.length; m++) {
      var tpl = loc.templates[m], p = tpl.pool;
      var malTema = MAL_TEMA[m] || "everyday";
      for (var a = 0; a < p.length; a++) {
        for (var b = a + 1; b < p.length; b++) {
          var pair = [tpl.t.replace("{}", p[a]), tpl.t.replace("{}", p[b])];
          var kk = key(pair);
          if (seen[kk]) continue;
          seen[kk] = true;
          out.push(pair);
          temaer.push(malTema);
          maler.push(m);
          ledd.push([a, b]);
        }
      }
    }
    // 350 håndskrevne fra september 2026. De står bakerst, etter de genererte,
    // så plassnumrene til alt som fantes før er uendret: gamle duellenker og
    // «sett»-minnet peker fortsatt på riktig dilemma.
    var ekstra = loc.extra || [], ekstraTema = window.VDH_EKSTRA_TEMA || [];
    for (var e = 0; e < ekstra.length; e++) {
      out.push(ekstra[e]);
      temaer.push(ekstraTema[e] || "everyday");
      maler.push(-1);
      ledd.push(null);
    }
    return { list: out, themes: temaer, maler: maler, ledd: ledd };
  }

  var bygget = buildQuestions(L);
  var QUESTIONS = bygget.list;
  var TEMA_FOR = bygget.themes;
  var MAL_FOR = bygget.maler;
  var LEDD_FOR = bygget.ledd;

  // ---------- measurement ----------
  function track(name, props) {
    try {
      var p = props || {};
      p.lang = lang;
      if (typeof window.plausible === "function") window.plausible(name, { props: p });
      if (window.umami && typeof window.umami.track === "function") window.umami.track(name, p);

  // ---------- storage ----------
  function readHistory() {
    try {
      var raw = localStorage.getItem(HISTORY_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function writeHistory() {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-MAX_HISTORY))); }
    catch (e) { /* private mode — play on without saving */ }
  }
  function readDaily() {
    try {
      var raw = localStorage.getItem(DAILY_KEY);
      var d = raw ? JSON.parse(raw) : null;
      if (d && typeof d.streak === "number" && typeof d.last === "string") return d;
    } catch (e) { /* ignore */ }
    return { last: "", streak: 0, side: "" };
  }
  function writeDaily() {
    try { localStorage.setItem(DAILY_KEY, JSON.stringify(daily)); } catch (e) { /* ignore */ }
  }

  // ---------- helpers ----------
  function stokk(arr) {
    for (var j = arr.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var tmp = arr[j]; arr[j] = arr[k]; arr[k] = tmp;
    }
    return arr;
  }

  // Varig minne om hva du har svart på. Uten dette stokkes bunken på nytt ved
  // hver sidelasting, og du får igjen dilemmaer du nettopp har svart på.
  // Lagret som bitkart: 3 041 plasser blir 381 byte.
  var SEEN_KEY = "vdh_sett_v1";
  var seenBits = (function () {
    var bytes = new Uint8Array(Math.ceil(4096 / 8));
    try {
      var raw = localStorage.getItem(SEEN_KEY);
      if (raw) {
        var bin = atob(raw);
        for (var i = 0; i < bin.length && i < bytes.length; i++) bytes[i] = bin.charCodeAt(i);
      }
    } catch (e) { /* privat modus — spill videre uten minne */ }
    return bytes;
  })();

  function erSett(i) { return (seenBits[i >> 3] >> (i & 7)) & 1; }
  function merkSett(i) {
    if (typeof i !== "number" || i < 0) return;
    seenBits[i >> 3] |= 1 << (i & 7);
    lagreSett();
  }
  function lagreSett() {
    try {
      var s = "";
      for (var i = 0; i < seenBits.length; i++) s += String.fromCharCode(seenBits[i]);
      localStorage.setItem(SEEN_KEY, btoa(s));
    } catch (e) { /* ignore */ }
  }
  function nullstillSett() {
    seenBits = new Uint8Array(seenBits.length);
    lagreSett();
  }

  // Bunken inneholder bare det du ikke har sett. De håndskrevne først, som før.
  function buildDeck() {
    // «Håndskrevet» er de 150 første og de 350 bakerst. Alt med en mal er
    // maskinlagd fra en ordliste, og det er dem som føles like. Derfor er
    // bunken bare håndskrevne så lenge det finnes håndskrevne igjen: 500
    // stykker, altså mange kvelder med spilling før noe gjentas.
    var kurert = [], generert = [];
    function samle() {
      for (var i = 0; i < QUESTIONS.length; i++) {
        if (erSett(i)) continue;
        if (MAL_FOR[i] === -1) kurert.push(i); else generert.push(i);
      }
    }
    samle();
    if (kurert.length === 0 && generert.length === 0) {
      nullstillSett();
      samle();
    }
    if (kurert.length) return spreTema(kurert);
    return bareGenererte(generert);
  }

  // To like temaer rett etter hverandre føles som samme dilemma, selv når de
  // ikke er det. Her stokkes bunken, og deretter flyttes et dilemma bakover
  // dersom det har samme tema som de to foregående.
  function spreTema(liste) {
    stokk(liste);
    var ut = [], rest = liste.slice();
    while (rest.length) {
      var valgt = 0;
      for (var i = 0; i < rest.length && i < 12; i++) {
        var t = TEMA_FOR[rest[i]];
        if (t !== TEMA_FOR[ut[ut.length - 1]] && t !== TEMA_FOR[ut[ut.length - 2]]) { valgt = i; break; }
      }
      ut.push(rest.splice(valgt, 1)[0]);
    }
    return ut;
  }

  // Først når alle 500 håndskrevne er brukt opp. Da går vi på rundgang mellom
  // malene, og innen en mal brukes ikke samme ledd («sjokolade») om igjen før
  // malen er tom for friske par.
  function bareGenererte(generert) {
    var perMal = {}, malRekke = [];
    for (var g = 0; g < generert.length; g++) {
      var mm = MAL_FOR[generert[g]];
      if (!perMal[mm]) { perMal[mm] = []; malRekke.push(mm); }
      perMal[mm].push(generert[g]);
    }
    for (var r = 0; r < malRekke.length; r++) stokk(perMal[malRekke[r]]);
    stokk(malRekke);
    var bruktLedd = {}, rundgang = 0, ut = [];
    while (malRekke.length) {
      if (rundgang >= malRekke.length) rundgang = 0;
      var mal = malRekke[rundgang], liste = perMal[mal];
      if (!liste.length) { malRekke.splice(rundgang, 1); continue; }
      var brukt = bruktLedd[mal] || (bruktLedd[mal] = {});
      var valgt = -1;
      for (var x = 0; x < liste.length; x++) {
        var l = LEDD_FOR[liste[x]];
        if (!brukt[l[0]] && !brukt[l[1]]) { valgt = x; break; }
      }
      if (valgt === -1) { bruktLedd[mal] = brukt = {}; valgt = 0; }
      var plass = liste.splice(valgt, 1)[0];
      brukt[LEDD_FOR[plass][0]] = brukt[LEDD_FOR[plass][1]] = 1;
      ut.push(plass);
      rundgang++;
    }
    return ut;
  }

  // Ekte stemmetall når et API er satt opp, ellers denne faste beregningen.
  // Den er lik for alle, så to spillere kan sammenligne — men den er ikke
  // ekte data, og teksten i appen sier aldri at den er det.
  var ekteTall = {};       // plass → [a, b] fra serveren
  var API = window.VDH_VOTE_API || "";
  var DUEL_API = API ? API.replace(/vote$/, "duel") : "";

  // ---------- anonym enhets-id ----------
  // Ikke en konto: ingen e-post, ingen navn, ingenting å logge inn på. Den
  // finnes bare for at en utfordring du legger ut skal finne veien hjem til
  // deg med svarene. Serveren kan ikke gjøre den om til en person.
  var MEG_KEY = "vdh_meg_v1";
  var meg = (function () {
    try {
      var lagret = localStorage.getItem(MEG_KEY);
      if (lagret && /^[0-9a-f]{16}$/.test(lagret)) return lagret;
    } catch (e) { /* privat modus */ }
    var s = "";
    try {
      var b = new Uint8Array(8);
      window.crypto.getRandomValues(b);
      for (var i = 0; i < 8; i++) s += ("0" + b[i].toString(16)).slice(-2);
    } catch (e2) {
      s = "";
      for (var j = 0; j < 16; j++) s += "0123456789abcdef".charAt(Math.floor(Math.random() * 16));
    }
    try { localStorage.setItem(MEG_KEY, s); } catch (e3) { /* ignore */ }
    return s;
  })();

  // Utfordringer denne enheten allerede har tatt, så potten ikke serverer
  // samme fremmede to ganger.
  var TATT_KEY = "vdh_tatt_v1";
  function lesTatt() {
    try {
      var r = JSON.parse(localStorage.getItem(TATT_KEY) || "[]");
      return Object.prototype.toString.call(r) === "[object Array]" ? r : [];
    } catch (e) { return []; }
  }
  function merkTatt(id) {
    if (!id) return;
    var liste = lesTatt();
    if (liste.indexOf(id) !== -1) return;
    liste.unshift(id);
    try { localStorage.setItem(TATT_KEY, JSON.stringify(liste.slice(0, 200))); } catch (e) { /* ignore */ }
  }
  // Hvor mange svar vi allerede har vist deg, per utfordring. Differansen er
  // det merket på duellknappen teller.
  var VIST_KEY = "vdh_vist_v1";
  function lesVist() {
    try { return JSON.parse(localStorage.getItem(VIST_KEY) || "{}") || {}; } catch (e) { return {}; }
  }
  function lagreVist(o) {
    try { localStorage.setItem(VIST_KEY, JSON.stringify(o)); } catch (e) { /* ignore */ }
  }

  // Ett felles kall mot serveren. Alt her er valgfritt pynt: feiler det, skal
  // spillet virke like godt som før.
  function kall(url, opts, naar, feilet) {
    try {
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 6000);
      var o = opts || {};
      o.signal = ctrl.signal;
      fetch(url, o)
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { clearTimeout(timer); if (d) naar(d); else if (feilet) feilet(); })
        .catch(function () { clearTimeout(timer); if (feilet) feilet(); });
    } catch (e) { if (feilet) feilet(); }
  }
  function jsonPost(kropp) {
    return { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(kropp) };
  }

  function splitFor(qIndex) {
    if (ekteTall[qIndex]) {
      var e = ekteTall[qIndex], sum = e[0] + e[1];
      if (sum >= MIN_STEMMER) {
        var pa = Math.round((e[0] / sum) * 100);
        return [pa, 100 - pa];
      }
    }
    var seed = Math.sin(qIndex * 12.9898 + 4.1414) * 43758.5453;
    var frac = seed - Math.floor(seed);
    var a = 28 + Math.round(frac * 44);
    return [a, 100 - a];
  }
  // Under denne grensa er et ekte tall mer misvisende enn beregningen.
  var MIN_STEMMER = 20;

  function harEkteTall(qIndex) {
    var e = ekteTall[qIndex];
    return !!(e && e[0] + e[1] >= MIN_STEMMER);
  }

  // Sender stemmen og tar imot tellingen. Feiler stille — spillet skal virke
  // like godt uten server som med.
  function sendStemme(qIndex, side, naar) {
    if (!API) { if (naar) naar(); return; }
    try {
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 2500);
      fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // Språk og modus følger med, så brukstallene kan leses per marked.
        // ny = første svar noensinne på denne enheten.
        body: JSON.stringify({
          q: qIndex,
          side: side,
          lang: lang,
          kind: mode,
          ny: history.length === 1
        }),
        signal: ctrl.signal
      }).then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          clearTimeout(timer);
          if (d && typeof d.a === "number" && typeof d.b === "number") {
            ekteTall[qIndex] = [d.a, d.b];
          }
          if (naar) naar();
        })
        .catch(function () { clearTimeout(timer); if (naar) naar(); });
    } catch (e) { if (naar) naar(); }
  }
  function archetypeFor(score) {
    var list = T.archetypes;
    for (var i = 0; i < list.length; i++) if (score <= list[i].max) return list[i];
    return list[list.length - 1];
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function nfmt(n) {
    try { return n.toLocaleString(L.intl || lang); } catch (e) { return String(n); }
  }
  function shareUrl() {
    try {

        h.indexOf("claude.ai") === -1 && h.indexOf("claudeusercontent") === -1 &&
        h.indexOf("localhost") === -1;
      return own ? window.location.href.split("#")[0].split("?")[0] : "";
    } catch (e) { return ""; }
  }

  // ---------- challenge codes ----------
  var CODE_WIDTH = { "1": 2, "2": 3 };
  function encodeChallenge(entries) {
    var s = "2";
    for (var i = 0; i < entries.length; i++) {
      var id = entries[i].i.toString(36);
      while (id.length < 3) id = "0" + id;
      s += id + entries[i].s;
    }
    return s;
  }
  function prettyCode(code) { return (code.toUpperCase().match(/.{1,6}/g) || []).join("-"); }
  function decodeChallenge(raw) {
    var s = String(raw).toLowerCase().replace(/[^0-9a-z]/g, "");
    var w = CODE_WIDTH[s.charAt(0)];
    if (!w) return null;
    s = s.slice(1);
    var step = w + 1;
    if (s.length === 0 || s.length % step !== 0) return null;
    var out = [];
    for (var i = 0; i < s.length; i += step) {
      var qi = parseInt(s.substr(i, w), 36);
      var side = s.charAt(i + w);
      if (isNaN(qi) || qi < 0 || qi >= QUESTIONS.length || (side !== "a" && side !== "b")) return null;
      out.push({ i: qi, s: side });
    }
    return out;
  }
  // A code must only carry slots that mean the same thing in every language.
  function codeEligible(entry) {
    return typeof entry.i === "number" && LOCAL_SLOTS.indexOf(entry.i) === -1;
  }

  // ---------- today's dilemma ----------
  function dayNumber() {
    var t0 = new Date();
    return Math.floor(Date.UTC(t0.getFullYear(), t0.getMonth(), t0.getDate()) / 86400000);
  }
  function dateKey(d) {
    var x = d || new Date();
    var m = x.getMonth() + 1, day = x.getDate();
    return x.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  }
  function prettyDate() {
    var x = new Date();
    return t("date_format", {
      weekday: T.weekdays[x.getDay()],
      day: x.getDate(),
      month: T.months[x.getMonth()]
    });
  }
  // Skips the locally-flavoured slots so the whole world gets the same one.
  function dailyQuestionIndex() {
    var pool = [];
    for (var i = 0; i < CURATED_COUNT; i++) if (LOCAL_SLOTS.indexOf(i) === -1) pool.push(i);
    return pool[(dayNumber() * 73) % pool.length];
  }
  function dailyDone() { return daily.last === dateKey(); }
  function recordDaily(side) {
    var y = new Date();
    y.setDate(y.getDate() - 1);
    daily.streak = daily.last === dateKey(y) ? daily.streak + 1 : 1;
    daily.last = dateKey();
    daily.side = side;
    writeDaily();
  }
  function updateChip() {
    if (dailyDone()) {
      dailyBtn.classList.remove("todo");
      // Rekka er verdt å se. Null dager trenger ikke noe merke.
      if (daily.streak > 0) { dailyLabel.hidden = false; dailyLabel.textContent = String(daily.streak); }
      else { dailyLabel.hidden = true; }
      dailyBtn.setAttribute("title", t("daily_chip"));
    } else {
      dailyBtn.classList.add("todo");
      dailyLabel.hidden = false;
      dailyLabel.textContent = "!";
      dailyBtn.setAttribute("title", t("daily_chip"));
    }
  }

        lastSprak(code, function (ok) { if (ok) switchLang(code); });
      });
    }
  }

  // Switching rebuilds the dilemma set in place — no reload, so a duel or a
  // streak in progress survives it.
  function switchLang(code) {
    lang = code;
    L = LOCALES[lang];
    T = L.ui;
    var b2 = buildQuestions(L);
    QUESTIONS = b2.list;
    TEMA_FOR = b2.themes;
    MAL_FOR = b2.maler;
    LEDD_FOR = b2.ledd;
    CURATED_COUNT = L.curated.length;
    paintStatic();
    paintLangMenu();
    updateChip();
    if (mode === "solo") { order = buildDeck(); cursor = 0; }
    closePanel(statsPanel); closePanel(duelPanel); closePanel(dailyPanel);
    if (mode === "daily") { render(); } else if (mode === "duel") { render(); } else { render(); }
  }

  // ---------- game ----------
  function currentEntry() {
    if (mode === "duel") return duel.friend[duel.idx];
    if (mode === "daily") return { i: dailyQuestionIndex(), s: null };
    // Hopp over det som ble besvart i dagens dilemma eller i en duell etter at
    // bunken ble lagt — ellers dukker de opp igjen her.
    while (cursor < order.length && erSett(order[cursor])) cursor++;
    if (cursor >= order.length) { order = buildDeck(); cursor = 0; }
    return { i: order[cursor], s: null };
  }

  function render() {
    answered = false;
    if (typeof visTips === "function") visTips();
    var q = QUESTIONS[currentEntry().i];
    labelA.textContent = q[0];
    labelB.textContent = q[1];
    pctA.textContent = "";
    pctB.textContent = "";
    optA.className = "option option-a";
    optB.className = "option option-b";
    optA.querySelector(".option-fill").style.transform = "";
    optB.querySelector(".option-fill").style.transform = "";

    optA.disabled = false;
    optB.disabled = false;

    if (mode === "duel") {
      nextBtn.textContent = duel.idx === duel.friend.length - 1 ? t("see_result") : t("next");
      duelProgress.textContent = t("duel_progress", { n: duel.idx + 1, m: duel.friend.length });
      hint.textContent = t("hint_duel");

  function choose(which) {
    if (answered) return;
    answered = true;

    var entry = currentEntry();
    var qi = entry.i;
    var q = QUESTIONS[qi];
    var split = splitFor(qi);

    optA.querySelector(".option-fill").style.transform = "scaleY(" + (split[0] / 100) + ")";
    optB.querySelector(".option-fill").style.transform = "scaleY(" + (split[1] / 100) + ")";
    pctA.textContent = split[0] + "%";
    pctB.textContent = split[1] + "%";
    optA.classList.add("revealed");
    optB.classList.add("revealed");
    (which === "a" ? optA : optB).classList.add("chosen");
    optA.disabled = true;
    optB.disabled = true;

    var chosenPct = which === "a" ? split[0] : split[1];
    history.push({ i: qi, s: which, q: q[which === "a" ? 0 : 1], pct: chosenPct, t: TEMA_FOR[qi] });
    writeHistory();
    // Uansett modus: svart er svart, og skal aldri komme igjen i bunken.
    merkSett(qi);
    if (history.length === 1) track("forste_svar");

    // Tallet vises med en gang. Kommer det ekte tall fra serveren, byttes de
    // inn i etterkant — ingen venting, ingen kunstig pause.
    sendStemme(qi, which, function () {
      if (!harEkteTall(qi) || currentEntry().i !== qi) return;
      var ekte = splitFor(qi);
      pctA.textContent = ekte[0] + "%";
      pctB.textContent = ekte[1] + "%";
      optA.querySelector(".option-fill").style.transform = "scaleY(" + (ekte[0] / 100) + ")";
      optB.querySelector(".option-fill").style.transform = "scaleY(" + (ekte[1] / 100) + ")";
      var h = history[history.length - 1];
      if (h && h.i === qi) { h.pct = which === "a" ? ekte[0] : ekte[1]; writeHistory(); }
    });

    if (mode === "duel") {
      (entry.s === "a" ? optA : optB).classList.add("friend-pick");
      duel.mine.push(which);
      hint.textContent = entry.s === which ? t("hint_agree") : t("hint_disagree");
    } else if (mode === "daily") {
      recordDaily(which);
      updateChip();
      track("dagens_dilemma_svart", { streak: String(daily.streak) });
      hint.textContent = chosenPct >= 50 ? t("hint_majority") : t("hint_minority");
    } else {
      hint.textContent = chosenPct >= 50 ? t("hint_majority") : t("hint_minority");
      if (!nudged && history.length >= 10) {
        nudged = true;
        statsBtn.classList.add("nudge");
        hint.textContent = t("nudge_profile");
      }
    }
    nextBtn.classList.add("show");
  }

  function advance() {
    if (mode === "duel") {
      if (duel.idx >= duel.friend.length - 1) { showDuelResult(); return; }
      duel.idx += 1;
    } else if (mode === "daily") { showDailyResult(); return; }
    else { cursor += 1; }
    // Bygger du en utfordring, stopper vi her når de ti er i boks.
    if (venterUtfordring && mode === "solo") {
      if (kvalifiserte().length >= DUEL_SIZE) {
        avbrytUtfordringsbygg();
        render();
        visUtfordringKlar();
        return;
      }
      oppdaterByggBanner();
    }
    render();
  }

  optA.addEventListener("click", function () { choose("a"); });
  optB.addEventListener("click", function () { choose("b"); });
  nextBtn.addEventListener("click", advance);

  // ---------- chart ----------
  function gaussian(x, mean, sd) {
    var z = (x - mean) / sd;
    return Math.exp(-0.5 * z * z) / (sd * Math.sqrt(2 * Math.PI));
  }
  function bellCurveSvg(score) {
    var w = 300, h = 150, padL = 8, padR = 8, padT = 16, padB = 26;
    var plotW = w - padL - padR, plotH = h - padT - padB;
    var maxY = gaussian(POP_MEAN, POP_MEAN, POP_SD);
    var pts = [];
    for (var x = 0; x <= 100; x += 2) pts.push([x, gaussian(x, POP_MEAN, POP_SD) / maxY]);
    function px(v) { return padL + (v / 100) * plotW; }
    function py(n) { return padT + plotH - n * plotH * 0.92; }
    var line = pts.map(function (p) { return px(p[0]) + "," + py(p[1]); }).join(" ");
    var area = px(0) + "," + py(0) + " " + line + " " + px(100) + "," + py(0);
    var s = Math.max(0, Math.min(100, score));
    var within = Math.abs(s - POP_MEAN) <= POP_SD;
    var col = within ? "var(--accent-b)" : "var(--accent-a)";
    var my = py(gaussian(s, POP_MEAN, POP_SD) / maxY);
    var mx = px(s), base = py(0), meanX = px(POP_MEAN);
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" role="img" aria-label="' + esc(t("chart_alt")) + '">' +
      '<line x1="' + padL + '" y1="' + base + '" x2="' + (w - padR) + '" y2="' + base + '" stroke="var(--line)" stroke-width="1"/>' +
      '<line x1="' + meanX + '" y1="' + padT + '" x2="' + meanX + '" y2="' + base + '" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>' +
      '<polygon points="' + area + '" fill="var(--accent-b-soft)" opacity="0.9"/>' +
      '<polyline points="' + line + '" fill="none" stroke="var(--ink-soft)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<line x1="' + mx + '" y1="' + my + '" x2="' + mx + '" y2="' + base + '" stroke="' + col + '" stroke-width="2"/>' +
      '<circle cx="' + mx + '" cy="' + my + '" r="5.5" fill="' + col + '" stroke="var(--surface)" stroke-width="2"/>' +
      '<text x="' + mx + '" y="' + Math.max(10, my - 10) + '" text-anchor="middle" font-size="10" font-weight="700" fill="' + col + '" font-family="Sora, sans-serif">' + esc(t("chart_you")) + '</text>' +
      '<text x="' + padL + '" y="' + (h - 8) + '" font-size="9" fill="var(--ink-soft)" font-family="Sora, sans-serif">0 %</text>' +
      '<text x="' + meanX + '" y="' + (h - 8) + '" text-anchor="middle" font-size="9" fill="var(--ink-soft)" font-family="Sora, sans-serif">' + esc(t("chart_mean")) + '</text>' +
      '<text x="' + (w - padR) + '" y="' + (h - 8) + '" text-anchor="end" font-size="9" fill="var(--ink-soft)" font-family="Sora, sans-serif">100 %</text>' +
      '</svg>';
  }

  // ---------- sharing ----------
  function copyText(text, toastEl) {
    var done = function (ok) {
      if (toastEl) toastEl.textContent = ok ? t("toast_copied") : t("toast_manual");
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
        return;
      }
    } catch (e) { /* fall through */ }
    done(false);
  }
  function tryNativeShare(text) {
    try {
      if (navigator.share) { navigator.share({ text: text }).catch(function () {}); return true; }
    } catch (e) { /* ignore */ }
    return false;
  }

  // Regner ut hvor normal du er innen hvert tema, og hvor langt du er fra å
  // låse opp de som ikke er åpne ennå.
  function temaTall() {
    var per = {};
    for (var i = 0; i < TEMA_ORDEN.length; i++) per[TEMA_ORDEN[i]] = { n: 0, med: 0 };
    for (var j = 0; j < history.length; j++) {
      var h = history[j];
      var tema = h.t || (typeof h.i === "number" ? TEMA_FOR[h.i] : null);
      if (!tema || !per[tema]) continue;
      per[tema].n += 1;
      if (h.pct >= 50) per[tema].med += 1;
    }
    var apne = [], laste = [];
    for (var k = 0; k < TEMA_ORDEN.length; k++) {
      var navn = TEMA_ORDEN[k], d = per[navn];
      if (d.n >= TEMA_KRAV) {
        apne.push({ tema: navn, n: d.n, score: Math.round((d.med / d.n) * 100) });
      } else {
        laste.push({ tema: navn, n: d.n });
      }
    }
    apne.sort(function (a, b) { return b.score - a.score; });
    laste.sort(function (a, b) { return b.n - a.n; });
    return { apne: apne, laste: laste };
  }

  function temaKort() {
    var d = temaTall();
    var html = '<div class="card"><h3>' + esc(t("card_themes")) + "</h3>";

    if (d.apne.length === 0) {
      html += "<p>" + esc(t("themes_none", { n: TEMA_KRAV })) + "</p>";
    } else {
      html += '<ul class="tema-liste">';
      for (var i = 0; i < d.apne.length; i++) {
        var a = d.apne[i];
        var farge = a.score >= 50 ? "var(--accent-b)" : "var(--accent-a)";
        html += "<li>" +
          '<div class="tema-rad">' +
            '<span class="tema-navn">' + esc(t("theme_" + a.tema)) + "</span>" +
            '<span class="tema-tall">' + a.score + "%</span>" +
          "</div>" +
          '<div class="tema-spor"><div class="tema-fyll" style="width:' + a.score + '%;background:' + farge + '"></div></div>' +
        "</li>";
      }
      html += "</ul>";
      var ytterst = d.apne[d.apne.length - 1];
      html += '<div class="chart-caption">' +
        esc(t("themes_caption", { high: t("theme_" + d.apne[0].tema), low: t("theme_" + ytterst.tema) })) +
        "</div>";
    }

    if (d.laste.length > 0) {
      html += '<div class="tema-last"><h3>' + esc(t("themes_locked")) + "</h3><ul class=\"tema-liste laast\">";
      for (var j = 0; j < Math.min(d.laste.length, 5); j++) {
        var l = d.laste[j];
        html += "<li><div class=\"tema-rad\">" +
          '<span class="tema-navn">' + esc(t("theme_" + l.tema)) + "</span>" +
          '<span class="tema-tall">' + l.n + "/" + TEMA_KRAV + "</span>" +
          "</div>" +
          '<div class="tema-spor"><div class="tema-fyll laast" style="width:' + Math.round((l.n / TEMA_KRAV) * 100) + '%"></div></div>' +
        "</li>";
      }
      html += "</ul></div>";
    }

    // Plass til en annonse senere. Ingen kunstig venting for å fylle den.
    html += '<div class="ad-slot" id="adSlot" hidden></div>';
    return html + "</div>";
  }

    var shareToast = document.getElementById("shareToast");
    document.getElementById("shareBtn").addEventListener("click", function () {
      track("delt", { hva: "profil" });
      if (!tryNativeShare(shareLine)) copyText(shareLine, shareToast);

        hentTilfeldig(function (kandidat) {
          var neste = decodeChallenge(kandidat.k);
          if (!neste) { igjen.disabled = false; igjen.textContent = t("duel_offline"); return; }
          closePanel(duelPanel);
          startDuel(neste, kandidat.id, "tilfeldig");
        }, function (grunn) {
          igjen.disabled = false;
          igjen.textContent = grunn === "tom" ? t("duel_pool_empty") : t("duel_offline");
        });
      });
    }
    openPanel(duelPanel);
  }

  // ---------- installer på startskjermen ----------
  // Telefonen kan installere sida som en app: eget ikon, fullskjerm, ingen
  // nettleserlinje. Android sier fra når det er mulig; iPhone må få en
  // forklaring, fordi Safari aldri tilbyr det av seg selv.
  var installHendelse = null;
  var installert = false;
  function kjorerSomApp() {
    try {
      return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
        window.navigator.standalone === true;
    } catch (e) { return false; }
  }
  function erIphone() {
    var ua = navigator.userAgent || "";
    return /iPhone|iPad|iPod/i.test(ua) && !/CriOS|FxiOS|EdgiOS/i.test(ua);
  }
  function egenSide() { return !!shareUrl(); }
  function installKort() {
    if (!egenSide() || kjorerSomApp()) return "";
    if (installert) {
      return '<div class="card"><h3>' + esc(t("card_install")) + "</h3><p>" + esc(t("install_done")) + "</p></div>";
    }
    if (installHendelse) {
      return '<div class="card"><h3>' + esc(t("card_install")) + "</h3>" +
        "<p>" + esc(t("install_desc")) + "</p>" +
        '<div class="btn-row"><button class="btn btn-primary" id="installBtn" type="button">' +
          esc(t("btn_install")) + "</button></div></div>";
    }
    if (erIphone()) {
      return '<div class="card"><h3>' + esc(t("card_install")) + "</h3>" +
        "<p>" + esc(t("install_desc")) + "</p>" +
        '<p class="btn-sub" style="text-align:left">' + esc(t("install_ios")) + "</p></div>";
    }
    return "";
  }
  function bindInstall() {
    var b = document.getElementById("installBtn");
    if (!b || !installHendelse) return;
    b.addEventListener("click", function () {
      var h = installHendelse;
      installHendelse = null;
      track("installer_trykket");
      try {
        h.prompt();
        h.userChoice.then(function (valg) {
          if (valg && valg.outcome === "accepted") { installert = true; track("installert"); }
          if (statsPanel.classList.contains("open")) renderStats();
        }, function () {});
      } catch (e) { /* ignore */ }
    });
  }
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    installHendelse = e;
    if (statsPanel.classList.contains("open")) renderStats();
    if (typeof visTips === "function") visTips();
  });
  window.addEventListener("appinstalled", function () {
    installert = true;
    installHendelse = null;
    track("installert");
    if (typeof visTips === "function") visTips();
  });
  // Service worker: holder appen i gang uten nett, men henter alltid nyeste
  // versjon først når nettet er der. Bare på egen side, aldri i forhåndsvisning.
  if (egenSide() && "serviceWorker" in navigator) {
    try {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      });
    } catch (e) { /* ignore */ }
  }
  if (kjorerSomApp()) track("apnet_som_app");

  // ---------- båndet øverst ----------
  // To problemer det løser. Åpner noen lenken inne i Messenger, Instagram
  // eller Snapchat, sitter de i en innebygd nettleser som ikke kan installere
  // noe. Og de som er i Chrome, finner ikke installeringen av seg selv når
  // den ligger i profilen. Båndet sier fra om begge deler, én gang, og lar
  // seg lukke.
  var TIPS_KEY = "vdh_tips_v1";
  var tipsLukket = (function () {
    try { return localStorage.getItem(TIPS_KEY) === "1"; } catch (e) { return false; }
  })();
  var tipsBar = document.getElementById("tipsBar");
  var tipsText = document.getElementById("tipsText");
  var tipsAction = document.getElementById("tipsAction");
  var tipsClose = document.getElementById("tipsClose");

  // Facebook, Instagram, Messenger, Snapchat, TikTok, X og LinkedIn åpner
  // lenker i sin egen nettleser inni appen.
  function iAppNettleser() {
    var ua = navigator.userAgent || "";
    if (/FBAN|FBAV|FB_IAB|FBIOS|Instagram|Snapchat|TikTok|Twitter|LinkedInApp|Line\//i.test(ua)) return true;
    // Android-webview uten Chrome-kjennetegn
    return /\bwv\b/.test(ua) && /Android/i.test(ua);
  }
  function erAndroid() { return /Android/i.test(navigator.userAgent || ""); }

  function apneIEgenNettleser() {
    var u = window.location.href;
    track("apne_i_nettleser");
    if (erAndroid()) {
      // Android forstår intent-lenker: dette åpner Chrome på samme side.
      var uten = u.replace(/^https?:\/\//, "");
      window.location.href = "intent://" + uten + "#Intent;scheme=https;package=com.android.chrome;end";
      return;
    }
    // iPhone kan ikke tvinges. Noen innebygde nettlesere godtar denne, resten
    // får lenken kopiert, så den kan limes inn i Safari.
    try { window.location.href = "x-safari-" + u; } catch (e) { /* ignore */ }
    setTimeout(function () {
      kopier(u, function (ok) {
        tipsText.textContent = t(ok ? "tips_kopiert" : "tips_ios_manuelt");
        tipsAction.hidden = true;
      });
    }, 700);
  }

  function kopier(tekst, naar) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(tekst).then(function () { naar(true); }, function () { naar(false); });
        return;
      }
    } catch (e) { /* ignore */ }
    naar(false);
  }

  function visTips() {
    if (!tipsBar) return;
    if (!egenSide() || kjorerSomApp() || tipsLukket || installert) { tipsBar.hidden = true; return; }
    // Dagens dilemma er den vanlige åpningsskjermen, så der skal båndet vises.
    // Under en duell og mens en utfordring bygges, skal ingenting forstyrre.
    if (mode === "duel" || venterUtfordring) { tipsBar.hidden = true; return; }

    if (iAppNettleser()) {
      tipsText.textContent = t("tips_innebygd");
      tipsAction.textContent = t("tips_apne_knapp");
      tipsAction.hidden = false;
      tipsBar.hidden = false;
      return;
    }
    // Ikke mas med installering før de har spilt litt.
    if (history.length < 3) { tipsBar.hidden = true; return; }
    if (installHendelse) {
      tipsText.textContent = t("tips_installer");
      tipsAction.textContent = t("btn_install");
      tipsAction.hidden = false;
      tipsBar.hidden = false;
      return;
    }
    if (erIphone()) {
      tipsText.textContent = t("tips_installer_ios");
      tipsAction.hidden = true;
      tipsBar.hidden = false;
      return;
    }
    tipsBar.hidden = true;
  }

  if (tipsAction) {
    tipsAction.addEventListener("click", function () {
      if (iAppNettleser()) { apneIEgenNettleser(); return; }
      var h = installHendelse;
      if (!h) return;
      installHendelse = null;
      track("installer_trykket_band");
      try {
        h.prompt();
        h.userChoice.then(function (valg) {
          if (valg && valg.outcome === "accepted") { installert = true; track("installert"); }
          visTips();
        }, function () {});
      } catch (e) { /* ignore */ }
    });
  }
  if (tipsClose) {
    tipsClose.addEventListener("click", function () {
      tipsLukket = true;
      try { localStorage.setItem(TIPS_KEY, "1"); } catch (e) { /* ignore */ }
      tipsBar.hidden = true;
    });
  }

  // ---------- duellmeny ----------
  // Legger utfordringen i den åpne potten og gir tilbake en id. Feiler det,
  // virker lenken likevel — den bærer hele utfordringen i seg selv.
  function leggUtUtfordring(raw, naar) {
    if (!DUEL_API) { naar(""); return; }
    kall(DUEL_API, jsonPost({ op: "ny", k: raw, lang: lang, mid: meg }),
      function (d) { naar(d && d.id ? d.id : ""); },
      function () { naar(""); });
  }
  function hentTilfeldig(naar, feilet) {
    if (!DUEL_API) { feilet("nede"); return; }
    kall(DUEL_API + "?tilfeldig=1&mid=" + encodeURIComponent(meg), null, function (d) {
      var kandidater = (d && d.kandidater) || [];
      var tatt = lesTatt();
      for (var i = 0; i < kandidater.length; i++) {
        if (tatt.indexOf(kandidater[i].id) === -1) { naar(kandidater[i]); return; }
      }
      feilet("tom");
    }, function () { feilet("nede"); });
  }
  function sendDuellSvar(id, sider) {
    if (!DUEL_API || !id || !sider) return;
    merkTatt(id);
    kall(DUEL_API, jsonPost({ op: "svar", id: id, sider: sider, mid: meg }),
      function () { /* stille */ }, function () { /* stille */ });
  }
  function hentMine(naar) {
    if (!DUEL_API) { naar([]); return; }
    kall(DUEL_API + "?mine=" + encodeURIComponent(meg), null,
      function (d) { naar((d && d.mine) || []); },
      function () { naar([]); });
  }

  // Regn ut hvor enige du og den fremmede var, ut fra din egen kode.
  function oppsummerMine(mine) {
    var ut = [];
    for (var i = 0; i < mine.length; i++) {
      var egne = decodeChallenge(mine[i].k);
      if (!egne) continue;
      var svar = mine[i].svar || [];
      var sumPct = 0, gyldige = 0;
      for (var j = 0; j < svar.length; j++) {
        var s = svar[j].s || "";
        if (s.length !== egne.length) continue;
        var enige = 0;
        for (var n = 0; n < egne.length; n++) if (s.charAt(n) === egne[n].s) enige++;
        sumPct += Math.round((enige / egne.length) * 100);
        gyldige++;
      }
      ut.push({
        id: mine[i].id,
        antall: gyldige,
        snitt: gyldige ? Math.round(sumPct / gyldige) : 0,
        lengde: egne.length
      });
    }
    return ut;
  }

  // Svarer serverdelen i det hele tatt? null = vet ikke ennå. Knappen for
  // tilfeldig motstander vises bare når svaret er ja — ingen skal møte en
  // feilmelding på forsiden fordi en serverfunksjon ikke er satt opp.
  var serverOk = null;
  function sjekkServer() {
    if (!DUEL_API) { serverOk = false; return; }
    kall(DUEL_API + "?tilfeldig=1&mid=" + encodeURIComponent(meg), null,
      function () { serverOk = true; },
      function () { serverOk = false; });
  }

  var mineResultater = [];
  function oppdaterDuellMerke() {
    var vist = lesVist(), nye = 0;
    for (var i = 0; i < mineResultater.length; i++) {
      var r = mineResultater[i];
      nye += Math.max(0, r.antall - (vist[r.id] || 0));
    }
    if (nye > 0) { duelBadge.hidden = false; duelBadge.textContent = String(nye); }
    else { duelBadge.hidden = true; duelBadge.textContent = ""; }
  }
  function sjekkMine() {
    hentMine(function (mine) {
      mineResultater = oppsummerMine(mine);
      oppdaterDuellMerke();
    });
  }

  // ---------- utfordring under oppbygging ----------
  // Har du ikke svart på nok dilemmaer ennå, spiller du dem først. Banneret
  // teller ned, slik at det føles som å stille opp et parti — ikke som en feil.
  var venterUtfordring = false;
  function kvalifiserte() { return history.filter(codeEligible); }
  function startUtfordringsbygg() {
    venterUtfordring = true;
    document.body.classList.add("bygger");
    closePanel(matchPanel);
    if (mode !== "solo") { mode = "solo"; duel = null; document.body.classList.remove("duel", "daily"); }
    oppdaterByggBanner();
    render();
  }
  function avbrytUtfordringsbygg() {
    venterUtfordring = false;
    document.body.classList.remove("bygger");
  }
  function oppdaterByggBanner() {
    if (!venterUtfordring) return;
    duelProgress.textContent = t("duel_building", {
      n: Math.min(kvalifiserte().length, DUEL_SIZE), m: DUEL_SIZE
    });
  }

  function visUtfordringKlar() {
    var recent = kvalifiserte().slice(-DUEL_SIZE);
    var raw = encodeChallenge(recent);
    var basis = shareUrl();
    track("kode_laget");

    matchBody.innerHTML =
      '<div class="card">' +
        "<h3>" + esc(t("duel_ready")) + "</h3>" +
        "<p>" + esc(t("challenge_desc")) + "</p>" +
        '<div class="btn-row"><button class="btn btn-primary" id="shareLink" type="button">' +
          esc(t("btn_share_link")) + "</button></div>" +
        '<div class="toast" id="matchToast"></div>' +
        '<div class="code-fallback">' + esc(t("code_fallback")) + "</div>" +
        '<div class="code-box">' + esc(prettyCode(raw)) + "</div>" +
        '<div class="btn-row"><button class="btn btn-ghost" id="copyCode" type="button">' +
          esc(t("btn_copy_code")) + "</button></div>" +
      "</div>";
    openPanel(matchPanel);

    var toast = document.getElementById("matchToast");
    var lenke = basis ? basis + "#" + raw : "";

    // Legg den i potten i bakgrunnen. Blir det en id, bærer lenken den med seg
    // slik at svarene finner veien tilbake hit.
    leggUtUtfordring(raw, function (id) {
      if (id) { lenke = basis ? basis + "#" + raw + "." + id : ""; sjekkMine(); }
    });

    document.getElementById("shareLink").addEventListener("click", function () {
      track("delt", { hva: "duell_lenke" });
      var msg = lenke ? t("challenge_link_msg", { url: lenke }) : t("challenge_msg", { code: prettyCode(raw) });
      if (!tryNativeShare(msg)) copyText(msg, toast);
    });
    document.getElementById("copyCode").addEventListener("click", function () {
      var msg = t("challenge_msg", { code: prettyCode(raw) }) + (basis ? "\n" + basis : "");
      if (!tryNativeShare(msg)) copyText(msg, toast);
    });
  }

  function renderMatch() {
    var vist = lesVist();
    var resultatKort = "";
    if (mineResultater.length) {
      var rader = "";
      for (var i = 0; i < mineResultater.length; i++) {
        var r = mineResultater[i];
        var nye = Math.max(0, r.antall - (vist[r.id] || 0));
        rader += "<li>" +
          '<span class="mark ' + (r.antall ? "agree" : "disagree") + '" aria-hidden="true">' +
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M9.5 17.5 21 6V3h-3L6.5 14.5"/></svg>' +
          "</span>" +
          "<span><strong>" +
            esc(r.antall
              ? t("duel_results_row", { n: r.antall, pct: r.snitt })
              : t("duel_results_waiting")) +
          "</strong>" +
          (nye ? '<span class="who">' + esc(nye === 1 ? t("duel_new_1") : t("duel_new_n", { n: nye })) + "</span>" : "") +
          "</span></li>";
      }
      resultatKort =
        '<div class="card"><h3>' + esc(t("duel_results_title")) + "</h3>" +
        '<ul class="duel-list">' + rader + "</ul></div>";
    }

    matchBody.innerHTML =
      resultatKort +
      '<div class="card">' +
        '<button class="btn btn-primary big" id="duelFriend" type="button">' + esc(t("duel_friend_btn")) + "</button>" +
        '<p class="btn-sub">' + esc(t("duel_friend_sub")) + "</p>" +
      "</div>" +
      (serverOk === false ? "" :
      '<div class="card">' +
        '<button class="btn btn-ghost big" id="duelRandom" type="button">' + esc(t("duel_random_btn")) + "</button>" +
        '<p class="btn-sub">' + esc(t("duel_random_sub")) + "</p>" +
        '<div class="error-note" id="randomNote"></div>' +
      "</div>") +
      '<div class="reset-row"><button class="reset-btn" id="codeToggle" type="button">' +
        esc(t("duel_code_toggle")) + "</button></div>" +
      '<div class="card" id="codeCard" hidden>' + codeEntryHtml() + "</div>";

    // Svarene er sett nå — nullstill merket.
    var nyVist = {};
    for (var k = 0; k < mineResultater.length; k++) nyVist[mineResultater[k].id] = mineResultater[k].antall;
    lagreVist(nyVist);
    oppdaterDuellMerke();

    document.getElementById("duelFriend").addEventListener("click", function () {
      if (kvalifiserte().length >= DUEL_SIZE) { visUtfordringKlar(); return; }
      startUtfordringsbygg();
    });

    var note = document.getElementById("randomNote");
    if (document.getElementById("duelRandom")) document.getElementById("duelRandom").addEventListener("click", function () {
      var knapp = document.getElementById("duelRandom");
      knapp.disabled = true;
      note.textContent = t("duel_searching");
      track("tilfeldig_sokt");
      hentTilfeldig(function (kandidat) {
        var entries = decodeChallenge(kandidat.k);
        if (!entries) { knapp.disabled = false; note.textContent = t("duel_offline"); return; }
        note.textContent = "";
        knapp.disabled = false;
        closePanel(matchPanel);
        startDuel(entries, kandidat.id, "tilfeldig");
      }, function (grunn) {
        knapp.disabled = false;
        note.textContent = grunn === "tom" ? t("duel_pool_empty") : t("duel_offline");
      });
    });

    document.getElementById("codeToggle").addEventListener("click", function () {
      var kort = document.getElementById("codeCard");
      kort.hidden = !kort.hidden;
      if (!kort.hidden) bindCodeEntry();
    });
  }

  // ---------- panels ----------
  function openPanel(p) { p.classList.add("open"); p.setAttribute("aria-hidden", "false"); }
  function closePanel(p) { p.classList.remove("open"); p.setAttribute("aria-hidden", "true"); }

  statsBtn.addEventListener("click", function () {
    statsBtn.classList.remove("nudge");
    renderStats();
    openPanel(statsPanel);
  });
  dailyBtn.addEventListener("click", function () {
    if (mode === "duel") return;
    if (dailyDone()) { showDailyResult(); return; }
    startDaily();
  });
  duelBtn.addEventListener("click", function () {
    track("duellmeny_apnet");
    renderMatch();
    openPanel(matchPanel);
  });
  document.getElementById("closeMatch").addEventListener("click", function () {
    closePanel(matchPanel);
  });
  langBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    langMenu.classList.toggle("open");
  });
  document.addEventListener("click", function (e) {
    if (!langMenu.contains(e.target) && e.target !== langBtn) langMenu.classList.remove("open");
  });
  document.getElementById("closeStats").addEventListener("click", function () { closePanel(statsPanel); });
  document.getElementById("closeDaily").addEventListener("click", function () {
    closePanel(dailyPanel);
    if (mode === "daily") endDaily();
  });
  document.getElementById("closeDuel").addEventListener("click", function () {
    closePanel(duelPanel);
    if (mode === "duel") endDuel();
  });
  document.getElementById("quitDuel").addEventListener("click", function () {
    if (mode === "daily") { endDaily(); return; }
    if (mode === "duel") { endDuel(); return; }
    // Bare oppbyggingen av en utfordring står igjen.
    avbrytUtfordringsbygg();
  });

  // ---------- boot ----------
  // Oppstarten er delt i tre, og hver del står for seg. Feiler pynten, skal
  // spillet likevel komme opp. Feiler selve spillet, skal spilleren få en
  // lesbar beskjed i stedet for en hvit skjerm — det var det folk fikk når de
  // åpnet lenken inne i Messenger på iPhone.
  function visNod(e) {
    try {
      var n = document.getElementById("rbNod");
      if (!n) return;
      n.hidden = false;
      var h = document.getElementById("rbNodHvorfor");
      if (h && e) h.textContent = (h.textContent ? h.textContent + " · " : "") + String((e && e.message) || e).slice(0, 160);
    } catch (e2) { /* ingenting mer å gjøre */ }
  }

  try {
    paintStatic();
    paintLangMenu();
    updateChip();
    order = buildDeck();
  } catch (eStart) {
    visNod(eStart);
    throw eStart;
  }

  // Rotsida viser standardspråket med en gang, og bytter til brukerens eget
  // straks det er hentet. Da slipper ingen å vente på en nedlasting for å se
  // det første dilemmaet.
  if (onsketSprak && onsketSprak !== lang) {
    lastSprak(onsketSprak, function (ok) {
      if (!ok) return;
      // En utfordring du nettopp åpnet skal stå på ditt eget språk, ikke på
      // avsenderens. Men har du alt begynt å svare, lar vi den være: da ville
      // dilemmaene byttet språk under beina på deg midt i runden.
      var trygt = mode !== "duel" || (duel && duel.mine.length === 0 && !answered);
      if (trygt) { try { switchLang(onsketSprak); } catch (e) { /* ignore */ } }
    });
  }

  // Alt under her er valgfritt. Faller det, skal spillet gå som før.
  try { track("apnet"); } catch (e) { /* ignore */ }
  // Har noen tatt utfordringen din mens du var borte? Svaret havner som et
  // merke på duellknappen. Feiler kallet, skjer det ingenting.
  try { sjekkMine(); } catch (e) { /* ignore */ }
  try { sjekkServer(); } catch (e) { /* ignore */ }

  (function boot() {
    try {
      var h = (window.location.hash || "").replace(/^#/, "");
      if (h) {
        // Lenka kan bære en id etter et punktum: <kode>.<id>. Den gjør at
        // svaret ditt finner veien tilbake til den som utfordret deg.
        var deler = h.split(".");
        var utfordringId = deler.length > 1 && /^[0-9a-f]{8,16}$/.test(deler[1]) ? deler[1] : "";
        var parsed = decodeChallenge(deler[0]);
        if (parsed) {
          // Rydd koden ut av adressen. Ellers starter duellen på nytt hver gang
          // siden lastes, og spilleren kommer seg aldri videre til vanlig spill.
          try {
            window.history.replaceState(null, "", window.location.pathname + window.location.search);
          } catch (e2) { /* eldre nettleser: lev med hashen */ }
          track("duell_via_lenke");
          startDuel(parsed, utfordringId, "lenke");
          return;
        }
      }
    } catch (e) { /* ugyldig kode i lenka: fortsett som vanlig */ }
    try {
      if (!dailyDone()) { startDaily(); return; }
    } catch (e) { /* dagens feilet: gå rett til vanlig spill */ }
    try {
      render();
    } catch (e) {
      visNod(e);
    }
  })();

  try {
    if (window.claude && window.claude.hot) {
      var start = function () {};
      window.claude.hot.ready ? window.claude.hot.ready(start) : start();
    }
  } catch (e) { /* not embedded */ }
})();
</script>

</body>
</html>
